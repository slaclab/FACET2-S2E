name: bmad-qpad

channels:
  - conda-forge
  - defaults
  
dependencies:
  - python=3.13
  - jupyter
  - numpy
  - matplotlib
  - pandas
  - bmad=20250811.0
  - pytao=0.5.3
  - openpmd-beamphysics=0.10.1
  - distgen=2.1.7
  - lume-base=0.3.3
  - lume-impact=0.10.1
  - bayesian-optimization
  - ca-certificates
  - openssl
  - xopt
  - certifi
  - git-lfs
  - picmistandard
  - periodictable
  - openpmd-viewer=1.10
  - openmpi
  - qpad=1.6.3=*_1
  - ffmpeg
  - pip:
    - git+https://github.com/ericcropp/OpenPMD_to_Bmad.git
    - git+https://github.com/slaclab/facet2-daq.git@v0.1.0
prefix: /sdf/group/ad/beamphysics/cropp/conda/bmadCondaEnv
